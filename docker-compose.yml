services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www
    volumes:
      - ./laravel:/var/www
    depends_on:
      - db

  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./laravel:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
      
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sarshanewton
      POSTGRES_PASSWORD: fadepass
      POSTGRES_DB: fade
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: sarsha.newton01@e-uvt.ro
      PGADMIN_DEFAULT_PASSWORD: sarsha!
    ports:
      - "5050:80"
    depends_on:
      - db
volumes:
  pgdata:


